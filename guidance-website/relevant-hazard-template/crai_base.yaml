# Settings for crai_base.ipynb — builds the statewide CRAI inputs in crai_cache/.
# Paths are relative to this file's folder.

# local -> build crai_cache/ from the snapshot files below (seconds, no AWS needed)
# s3    -> download the Cal-CRAI metrics from S3 and recompute every domain score
#          (a real refresh; needs AWS credentials, takes several minutes)
source: local

local:
  # Snapshots copied 2026-10-19 — see crai_seed/README.md for where each came from.
  adaptive_capacity: crai_seed/adaptive_capacity_index_DE.csv
  climate_metrics: crai_seed/concatenate_climate_metrics_DE.csv
  tracts: crai_seed/ca_tracts.gpkg      # git-ignored (58 MB); falls back to s3.tracts if missing

s3:
  bucket: ca-climate-index
  metrics_prefix: 3_fair_data/index_data/
  tracts: s3://ca-climate-index/0_map_data/2021_tiger_census_tract/2021_ca_tract/
  metric_list: cava_calcrai_metrics.csv
  redownload: false                     # true = discard the cached S3 download and fetch again
